name: Build and Release Android APK

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install Android Build Tools
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "build-tools;34.0.0" "platforms;android-34"

      - name: Prepare Web Assets & Copy for AAPT
        run: |
          mkdir -p assets/web
          cp -r web/* assets/
          cp -r web/* assets/web/
          ls -la assets/
          ls -la assets/web/

      - name: Compile Resources with AAPT
        run: |
          $ANDROID_HOME/build-tools/34.0.0/aapt package -f -m \
            -J android/app/src/main/java \
            -M android/app/src/main/AndroidManifest.xml \
            -S android/app/src/main/res \
            -I $ANDROID_HOME/platforms/android-34/android.jar \
            -A assets \
            -F compiled.ap_

      - name: Compile Java Code
        run: |
          mkdir -p bin/classes
          javac -d bin/classes \
            -classpath $ANDROID_HOME/platforms/android-34/android.jar \
            $(find android/app/src/main/java -name "*.java")

      - name: Convert Java Bytecode to DEX with D8
        run: |
          $ANDROID_HOME/build-tools/34.0.0/d8 \
            --output bin/ \
            --lib $ANDROID_HOME/platforms/android-34/android.jar \
            $(find bin/classes -name "*.class")

      - name: Package Unaligned APK
        run: |
          cd bin
          cp ../compiled.ap_ unaligned.apk
          zip -g unaligned.apk classes.dex

      - name: ZipAlign APK (4-byte alignment)
        run: |
          $ANDROID_HOME/build-tools/34.0.0/zipalign -v 4 bin/unaligned.apk bin/aligned.apk

      - name: Create Keystore & Sign APK with apksigner (V1, V2, V3 enabled)
        run: |
          keytool -genkey -v -keystore release.keystore \
            -alias polymind -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=PolyMind AI, OU=AI, O=Apravint, L=Chennai, S=TN, C=IN" \
            -storepass android -keypass android
          
          $ANDROID_HOME/build-tools/34.0.0/apksigner sign \
            --ks release.keystore \
            --ks-pass pass:android \
            --key-pass pass:android \
            --out bin/PolyMind.apk \
            --v1-signing-enabled true \
            --v2-signing-enabled true \
            --v3-signing-enabled true \
            bin/aligned.apk

      - name: Verify Signed APK
        run: |
          $ANDROID_HOME/build-tools/34.0.0/apksigner verify --verbose bin/PolyMind.apk

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PolyMind-APK
          path: bin/PolyMind.apk

      - name: Create GitHub Release and Upload APK
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main'
        with:
          name: "PolyMind AI v1.0.0"
          tag_name: "v1.0.0"
          body: |
            ## 🧠 PolyMind AI - Multi-LLM Orchestrator & Consensus Engine v1.0.0

            ### 🌟 Key Features:
            - **Multi-LLM Orchestration**: Query **ChatGPT (GPT-4o)**, **Claude (3.5 Sonnet)**, **Gemini (1.5 Pro)**, and **Ollama (Local LLM)** simultaneously.
            - **AI Consensus Engine**: Automatically synthesizes and harmonizes insights from all active models into a single master response.
            - **Side-by-Side Model Comparison**: Compare model reasoning, code snippets, and design tradeoffs side-by-side in real time.
            - **High-Fidelity Simulation Mode**: Evaluate consensus synthesis immediately with zero setup or API keys.
            - **Universal Installation Ready**: Built with 4-byte ZipAlignment & `apksigner` V1/V2/V3 signatures for Android 7.0 - 15+.
          files: |
            bin/PolyMind.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
